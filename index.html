<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Scales - CAGED System</title>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <div class="container">
        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <span class="control-label">Root Note:</span>
                <div class="note-selector">
                    <button class="note-btn" id="prevNote">&lt;</button>
                    <div class="note-display" id="currentNote">C</div>
                    <button class="note-btn" id="nextNote">&gt;</button>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">Pentatonic:</span>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="majorBtn" data-scale="major">Major</button>
                    <button class="toggle-btn" id="minorBtn" data-scale="minor">Minor</button>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">Display:</span>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="notesBtn" data-display="notes">Notes</button>
                    <button class="toggle-btn" id="intervalsBtn" data-display="intervals">Intervals</button>
                </div>
            </div>
        </div>

        <!-- CAGED Header -->
        <div class="caged-header" id="cagedHeader">
            <!-- Dynamically populated -->
        </div>

        <!-- Fretboard -->
        <div class="fretboard-container">
            <div class="fretboard" id="fretboard">
                <!-- Dynamically populated -->
            </div>
            <div class="fret-numbers" id="fretNumbers">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color legend-c"></div>
                <span>C Shape</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-a"></div>
                <span>A Shape</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-g"></div>
                <span>G Shape</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-e"></div>
                <span>E Shape</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-d"></div>
                <span>D Shape</span>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>

</html>
